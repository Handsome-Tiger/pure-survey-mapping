<rect width="2400" height="1650" fill="#fff"/><rect x="36" y="28" width="2328" height="94" rx="14" fill="url(#g)"/><text class="c ti" x="1200" y="72" text-anchor="middle">GNSS/INS–Livox–相机融合实景三维测绘系统流程</text><text class="c sub" x="1200" y="103" text-anchor="middle">外业多传感器同步采集 → KFGINS组合导航 → Livox逐点去畸变 → RTK锚定图优化 → 多视角真彩映射</text>
<rect class="ph" x="60" y="150" width="2280" height="285" rx="12"/><path class="bar" d="M72 150H2328Q2340 150 2340 162V198H60V162Q60 150 72 150Z"/><text class="c pt" x="1200" y="184" text-anchor="middle">Phase 1：外业机载多传感器同步采集与数据记录</text>
<rect class="se" x="92" y="222" width="310" height="174" rx="7"/><text class="c bt" x="247" y="252" text-anchor="middle">实地测绘平台</text><text class="c bd" x="122" y="284">• 无人机 / 机载测绘载荷</text><text class="c bd" x="122" y="315">• 实际航线与地物场景</text><text class="c bd" x="122" y="346">• 外业实时采集</text><text class="c sm" x="122" y="378">现场数据是系统源头</text>
<rect class="se" x="470" y="217" width="340" height="84" rx="7"/><text class="c bt" x="640" y="248" text-anchor="middle">GNSS / RTK + 飞控IMU</text><text class="c bd" x="640" y="277" text-anchor="middle">位置、速度、姿态、RTK质量</text><rect class="se" x="470" y="312" width="340" height="84" rx="7"/><text class="c bt" x="640" y="343" text-anchor="middle">Livox LiDAR + Livox IMU</text><text class="c bd" x="640" y="372" text-anchor="middle">原始回波、逐点时间、角速度</text><rect class="se" x="875" y="217" width="300" height="84" rx="7"/><text class="c bt" x="1025" y="248" text-anchor="middle">机载RGB相机</text><text class="c bd" x="1025" y="277" text-anchor="middle">压缩图像与时间戳</text><rect class="se" x="875" y="312" width="300" height="84" rx="7"/><text class="c bt" x="1025" y="343" text-anchor="middle">硬件时间基准</text><text class="c bd" x="1025" y="372" text-anchor="middle">RTK PPS / FC UTC</text>
<rect class="b" x="1260" y="235" width="330" height="142" rx="8"/><text class="c bt" x="1425" y="269" text-anchor="middle">机载同步记录</text><text class="c bd" x="1425" y="300" text-anchor="middle">ROS消息统一封装与落盘</text><text class="c bd" x="1425" y="330" text-anchor="middle">保存原始时间戳与话题</text><text class="c sm" x="1425" y="359" text-anchor="middle">rosbag仅为数据记录载体</text><rect class="b" x="1675" y="235" width="330" height="142" rx="8"/><text class="c bt" x="1840" y="269" text-anchor="middle">离线解析与观测整理</text><text class="c bd" x="1840" y="300" text-anchor="middle">解析各传感器原始消息</text><text class="c bd" x="1840" y="330" text-anchor="middle">统一字段、剔除无效记录</text><text class="c sm" x="1840" y="359" text-anchor="middle">观测CSV / 原始帧索引 / 图像流</text><rect class="b" x="2080" y="235" width="220" height="142" rx="8"/><text class="c bt" x="2190" y="269" text-anchor="middle">标定参数</text><text class="c bd" x="2190" y="301" text-anchor="middle">杆臂与外参</text><text class="c bd" x="2190" y="330" text-anchor="middle">相机内参与畸变</text><text class="c sm" x="2190" y="359" text-anchor="middle">测量 / 发布标定值</text>
<path class="ar" d="M402 309H445"/><path class="ar" d="M810 259H850"/><path class="ar" d="M810 354H850"/><path class="ar" d="M1175 259H1215V286H1250"/><path class="ar" d="M1175 354H1215V326H1250"/><path class="arb" d="M1590 306H1662"/>
<rect class="ph" x="60" y="470" width="2280" height="290" rx="12"/><path class="bar" d="M72 470H2328Q2340 470 2340 482V518H60V482Q60 470 72 470Z"/><text class="c pt" x="1200" y="504" text-anchor="middle">Phase 2：时间对齐、KFGINS组合导航与Livox逐点运动补偿</text>
<rect class="na" x="105" y="548" width="355" height="165" rx="8"/><text class="c bt" x="282" y="580" text-anchor="middle">Livox–导航时间对齐</text><text class="c bd" x="282" y="612" text-anchor="middle">双IMU角速度互相关估计</text><text class="c me" x="282" y="643" text-anchor="middle">t_nav = t_livox − 0.572 s</text><text class="c bd" x="282" y="674" text-anchor="middle">相关系数 0.929582</text><text class="c sm" x="282" y="700" text-anchor="middle">PPS / UTC独立诊断验证</text><rect class="na" x="535" y="548" width="430" height="165" rx="8"/><text class="c bt" x="750" y="580" text-anchor="middle">KFGINS误差状态组合导航</text><text class="c bd" x="750" y="612" text-anchor="middle">IMU机械编排与偏置状态估计</text><text class="c bd" x="750" y="643" text-anchor="middle">融合RTK位置/速度/航向/外部姿态</text><text class="c bd" x="750" y="674" text-anchor="middle">RTK质量自适应协方差 + 鲁棒更新</text><text class="c sm" x="750" y="700" text-anchor="middle">输出连续导航位姿与GNSS更新统计</text>
<rect class="li" x="1040" y="548" width="410" height="165" rx="8"/><text class="c bt" x="1245" y="580" text-anchor="middle">Livox原始回波筛选</text><text class="c bd" x="1245" y="612" text-anchor="middle">盲区0.8 m、tag/return有效性</text><text class="c bd" x="1245" y="643" text-anchor="middle">保留逐点相对时间与强度</text><text class="c me" x="1245" y="676" text-anchor="middle">4,349 个有效扫描</text><rect class="li" x="1525" y="548" width="405" height="165" rx="8"/><text class="c bt" x="1727" y="580" text-anchor="middle">逐点去畸变与世界坐标初始化</text><text class="c bd" x="1727" y="612" text-anchor="middle">Livox IMU积分补偿扫描内旋转</text><text class="c bd" x="1727" y="643" text-anchor="middle">导航轨迹插值补偿平移</text><text class="c bd" x="1727" y="674" text-anchor="middle">全部点归一到扫描参考时刻</text><text class="c sm" x="1727" y="700" text-anchor="middle">再由LiDAR外参变换至初始世界系</text><rect class="li" x="2005" y="548" width="290" height="165" rx="8"/><text class="c bt" x="2150" y="580" text-anchor="middle">关键帧构建</text><text class="c bd" x="2150" y="612" text-anchor="middle">每10帧选取关键帧</text><text class="c me" x="2150" y="645" text-anchor="middle">435 个关键帧</text><text class="c bd" x="2150" y="676" text-anchor="middle">体素化注册点云</text><text class="c sm" x="2150" y="700" text-anchor="middle">初始位姿来自KFGINS</text><path class="ar" d="M460 630H522"/><path class="ar" d="M965 630H1018"/><path class="ar" d="M1450 630H1512"/><path class="arb" d="M1930 630H1992"/><path class="da" d="M1840 377V448H282V535"/><text class="c nt" x="1040" y="449" text-anchor="middle">来自外业采集记录的传感器观测</text>
<rect class="ph" x="60" y="795" width="2280" height="285" rx="12"/><path class="bar" d="M72 795H2328Q2340 795 2340 807V843H60V807Q60 795 72 795Z"/><text class="c pt" x="1200" y="829" text-anchor="middle">Phase 3：LiDAR几何约束与RTK锚定全局位姿图优化</text>
<rect class="li" x="105" y="872" width="350" height="162" rx="8"/><text class="c bt" x="280" y="904" text-anchor="middle">约束候选搜索</text><text class="c bd" x="280" y="936" text-anchor="middle">相邻关键帧约束</text><text class="c bd" x="280" y="966" text-anchor="middle">空间邻近跨航带约束</text><text class="c sm" x="280" y="1001" text-anchor="middle">727候选：改善航带间一致性</text><rect class="li" x="530" y="872" width="390" height="162" rx="8"/><text class="c bt" x="725" y="904" text-anchor="middle">点到面迭代配准</text><text class="c bd" x="725" y="936" text-anchor="middle">对应点筛选、法向估计、鲁棒迭代</text><text class="c me" x="725" y="968" text-anchor="middle">接受639条：相邻431 + 跨航带208</text><text class="c sm" x="725" y="1001" text-anchor="middle">平均点到面RMSE 0.200841 m</text><rect class="na" x="995" y="872" width="350" height="162" rx="8"/><text class="c bt" x="1170" y="904" text-anchor="middle">绝对先验约束</text><text class="c bd" x="1170" y="936" text-anchor="middle">RTK平移先验</text><text class="c bd" x="1170" y="966" text-anchor="middle">外部姿态旋转先验</text><text class="c sm" x="1170" y="1001" text-anchor="middle">维持测绘坐标框架与绝对锚定</text><rect class="b" x="1420" y="872" width="420" height="162" rx="8"/><text class="c bt" x="1630" y="904" text-anchor="middle">非线性位姿图优化</text><text class="c bd" x="1630" y="936" text-anchor="middle">g2o：LiDAR约束 + RTK/姿态先验</text><text class="c bd" x="1630" y="966" text-anchor="middle">Huber核抑制异常约束</text><text class="c sm" x="1630" y="1001" text-anchor="middle">独立平移/旋转信息权重与安全门限</text><rect class="ou" x="1915" y="872" width="380" height="162" rx="8"/><text class="c bt" x="2105" y="904" text-anchor="middle">优化轨迹与连续修正场</text><text class="c bd" x="2105" y="936" text-anchor="middle">关键帧最优位姿 T_global</text><text class="c bd" x="2105" y="966" text-anchor="middle">时间插值的SE(3)位姿修正</text><text class="c sm" x="2105" y="1001" text-anchor="middle">供全量点云与相机位姿共同使用</text><path class="ar" d="M455 953H517"/><path class="ar" d="M920 953H977"/><path class="ar" d="M1345 953H1407"/><path class="arb" d="M1840 953H1902"/>
<rect class="ph" x="60" y="1115" width="2280" height="330" rx="12"/><path class="bar" d="M72 1115H2328Q2340 1115 2340 1127V1163H60V1127Q60 1115 72 1115Z"/><text class="c pt" x="1200" y="1149" text-anchor="middle">Phase 4：全量优化几何重建与多视角相机真彩映射</text>
<rect class="li" x="105" y="1195" width="380" height="198" rx="8"/><text class="c bt" x="295" y="1228" text-anchor="middle">全量优化几何重建</text><text class="c bd" x="295" y="1261" text-anchor="middle">重新读取每个有效Livox扫描</text><text class="c bd" x="295" y="1292" text-anchor="middle">应用同一去畸变与优化修正</text><text class="c bd" x="295" y="1323" text-anchor="middle">逐帧流式写出，避免内存堆积</text><text class="c me" x="295" y="1357" text-anchor="middle">74,367,651 个几何点</text><rect class="ca" x="565" y="1195" width="390" height="198" rx="8"/><text class="c bt" x="760" y="1228" text-anchor="middle">同步相机候选与优化位姿</text><text class="c bd" x="760" y="1261" text-anchor="middle">相机头时间 +0.1 s修正</text><text class="c bd" x="760" y="1292" text-anchor="middle">±0.12 s内最多选3帧</text><text class="c bd" x="760" y="1323" text-anchor="middle">KFGINS位姿叠加同一图优化修正</text><text class="c sm" x="760" y="1357" text-anchor="middle">4,349 / 4,349 LiDAR帧成功配对</text><rect class="ca" x="1035" y="1195" width="445" height="198" rx="8"/><text class="c bt" x="1257" y="1228" text-anchor="middle">逐点投影、可见性判断与取色</text><text class="c bd" x="1257" y="1261" text-anchor="middle">LiDAR→相机外参 + 内参/畸变投影</text><text class="c bd" x="1257" y="1292" text-anchor="middle">正深度、图像边界、Z-buffer遮挡检查</text><text class="c bd" x="1257" y="1323" text-anchor="middle">按时间差/像心距离择优，双线性采样</text><text class="c sm" x="1257" y="1357" text-anchor="middle">不进行3D近邻颜色传播或跨帧平均</text>
<rect class="ou" x="1560" y="1184" width="350" height="96" rx="8"/><text class="c bt" x="1735" y="1217" text-anchor="middle">完整彩色点云</text><text class="c bd" x="1735" y="1248" text-anchor="middle">真彩RGB / 未观测点强度灰度</text><text class="c sm" x="1735" y="1272" text-anchor="middle">含 color_valid 标记</text><rect class="ou" x="1560" y="1297" width="350" height="96" rx="8"/><text class="c bt" x="1735" y="1330" text-anchor="middle">严格真彩点云</text><text class="c bd" x="1735" y="1361" text-anchor="middle">仅保留通过全部可见性检查的点</text><text class="c sm" x="1735" y="1385" text-anchor="middle">73,125,606 个真彩点</text><rect class="ve" x="1985" y="1195" width="310" height="198" rx="8"/><text class="c bt" x="2140" y="1228" text-anchor="middle">独立质量验证</text><text class="c bd" x="2140" y="1261" text-anchor="middle">声明/实际记录数一致</text><text class="c bd" x="2140" y="1292" text-anchor="middle">XYZ有限、RGB范围、文件完整性</text><text class="c me" x="2140" y="1325" text-anchor="middle">真彩覆盖率 98.3299%</text><text class="c sm" x="2140" y="1357" text-anchor="middle">全部配置门限通过</text><path class="ar" d="M485 1294H552"/><path class="ar" d="M955 1294H1022"/><path class="ar" d="M1480 1262H1547"/><path class="ar" d="M1480 1328H1547"/><path class="arb" d="M1910 1232H1950V1270H1972"/><path class="arb" d="M1910 1345H1950V1318H1972"/>
<rect x="60" y="1480" width="2280" height="128" rx="12" fill="#e9f4f8" stroke="#176c90" stroke-width="2.8"/><text class="c pt" x="120" y="1518">Phase 5：最终测绘成果</text><rect x="410" y="1500" width="1370" height="78" rx="9" fill="#fff" stroke="#126e94" stroke-width="2.5" filter="url(#s)"/><text class="c bt" x="1095" y="1531" text-anchor="middle">cloud_optimized_color_complete.ply</text><text class="c bd" x="1095" y="1561" text-anchor="middle">RTK坐标框架下完整优化彩色三维点云：74,367,651点；真彩点存RGB，未观测点存强度灰度及 color_valid=0</text><rect x="1835" y="1500" width="450" height="78" rx="9" fill="#fff8e8" stroke="#b87822" stroke-width="2"/><text class="c bd" x="2060" y="1531" text-anchor="middle">配套报告：时间同步 / 图优化 / 着色</text><text class="c sm" x="2060" y="1560" text-anchor="middle">独立PLY验证与质量统计</text><path class="arb" d="M2140 1393V1460H1095V1488"/><text class="c nt" x="1200" y="1633" text-anchor="middle">方案边界：不依赖 FAST-LIO / FAST-LIVO2 / mapping-fusion；不使用DJI L1颜色迁移；不使用空间近邻补色。ROS bag仅用于记录外业实采传感器数据。</text>
